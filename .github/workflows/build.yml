name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cargotracksolutions/ecmr-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble sources (upstream + patches + overlay)
        run: bash scripts/assemble.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: build/src/pom.xml

      # eSeal signer/verifier are built from pinned source (upstream.lock), not taken from the OLF registry
      - name: Build eSeal
        working-directory: build/eseal
        run: |
          rm -rf ~/.m2/repository/org/openlogisticsfoundation/ecmr/signer ~/.m2/repository/org/openlogisticsfoundation/ecmr/verifier
          sh ./gradlew --no-daemon -q :signer:publishToMavenLocal :verifier:publishToMavenLocal -x test

      - name: Verify OLF artifact checksums
        working-directory: build/src
        run: |
          mvn -B -q dependency:go-offline
          sh cargotrack/verify-olf-artifacts.sh

      # Upstream test suite (incl. Keycloak Testcontainer - Docker is available on ubuntu-latest).
      - name: Test
        run: mvn -B -f build/src/pom.xml verify

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble sources
        run: bash scripts/assemble.sh

      - name: Image tags
        id: tags
        run: |
          . upstream.lock
          echo "upstream=${UPSTREAM_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "overlay=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: build
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.overlay }}-up${{ steps.tags.outputs.upstream }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ro.cargotrack.ecmr.upstream-sha=${{ steps.tags.outputs.upstream }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
