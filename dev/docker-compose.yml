# Local development stack: CargoTrack ecmr-backend + ecmr-frontend images with Keycloak, PostgreSQL and Mailpit.
# DEVELOPMENT ONLY - demo credentials, upstream test eSeal keystore, Keycloak in dev mode.
#
# Prerequisites (images built locally):
#   ecmr-backend:   scripts/assemble.sh && docker build -f docker/Dockerfile -t ecmr-backend:local build
#   ecmr-frontend:  scripts/assemble.sh && docker build -f docker/Dockerfile -t ecmr-frontend:local .
# Start:  docker compose -f dev/docker-compose.yml up -d
#
# Keycloak and the backend share one network namespace ("localhost" service), so the issuer
# http://localhost:8080/realms/cargotrack is the same URL for the browser and for the backend.

name: ecmr-dev

services:
  localhost:
    image: alpine:3.22
    command: sleep infinity
    ports:
      - "8080:8080" # Keycloak
      - "8081:8081" # Backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecmr
      POSTGRES_USER: ecmr
      POSTGRES_PASSWORD: ecmr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmr -d ecmr"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    network_mode: "service:localhost"
    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # dev-mode database (H2 under data/): users/passwords changed in the admin console survive "down"
      - kcdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 10s
      retries: 30
    depends_on:
      - localhost

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # web UI for mails sent by the backend (shares, guest links)

  ecmr-backend:
    image: ecmr-backend:local
    network_mode: "service:localhost"
    environment:
      SPRING_PROFILES_ACTIVE: cargotrack,jobs
      SERVER_PORT: "8081"
      APP_ORIGIN_URL: http://localhost:8081
      APP_FRONTEND_URL: http://localhost:8082
      WEB_CORS_ORIGINS: http://localhost:8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecmr
      SPRING_DATASOURCE_USERNAME: ecmr
      SPRING_DATASOURCE_PASSWORD: ecmr
      SPRING_LIQUIBASE_PARAMETERS_BOOTSTRAPADMINEMAIL: admin@cargotrack.local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://localhost:8080/realms/cargotrack
      SPRINGDOC_SWAGGER_UI_OAUTH_CLIENTID: ecmr-frontend
      SWAGGER_AUTH_URL: http://localhost:8080/realms/cargotrack/protocol/openid-connect/auth
      SWAGGER_TOKEN_URL: http://localhost:8080/realms/cargotrack/protocol/openid-connect/token
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      MAIL_FROM: ecmr-dev@cargotrack.local
      # Real SMS only when set in dev/.env (git-ignored); otherwise TAN messages appear in the backend log
      CARGOTRACK_SMS_ENABLED: ${CARGOTRACK_SMS_ENABLED:-false}
      CARGOTRACK_SMS_TOKEN: ${CARGOTRACK_SMS_TOKEN:-}
      CARGOTRACK_SMS_SENDER: ${CARGOTRACK_SMS_SENDER:-}
      CARGOTRACK_SMS_TEMPLATE: ${CARGOTRACK_SMS_TEMPLATE:-}
      # Upstream test keystore - never in production (see config/backend.env.example)
      ECMR_SEAL_SIGN_KEYSTORETYPE: jks
      ECMR_SEAL_SIGN_KEYSTOREPATH: /secrets/test-keystore.jks
      ECMR_SEAL_SIGN_KEYSTOREPASSWORD: password
      ECMR_SEAL_SIGN_KEYALIAS: test-alias
      ECMR_SEAL_SIGN_KEYPASSWORD: password
    volumes:
      - ../build/src/src/main/resources/eseal/test-keystore.jks:/secrets/test-keystore.jks:ro
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started

  ecmr-frontend:
    image: ecmr-frontend:local
    ports:
      - "8082:8080"
    environment:
      BACKEND_API_URL: http://localhost:8081/api
      OAUTH_ISSUER: http://localhost:8080/realms/cargotrack
      OAUTH_CLIENT_ID: ecmr-frontend
      FRAME_ANCESTORS: "'self' http://localhost:*"

volumes:
  pgdata:
  attachments:
  kcdata:
