components:
  schemas:
    EcmrImport:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ecmrId:
          type: string
          format: uuid
        instanceUrl:
          type: string
        sharingUserEmail:
          type: string
        receivingUserEmail:
          type: string
        shareToken:
          type: string
        senderSeal:
          type: string
        carrierSeal:
          type: string
        errorMessage:
          type: string
        creationTimestamp:
          type: string
          format: date-time
        importTimestamp:
          type: string
          format: date-time
    EcmrSync:
      type: object
      properties:
        ecmrId:
          type: string
          format: uuid
        shareToken:
          type: string
        seal:
          type: string
    MailSuffix:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mailSuffix:
          type: string
    CarrierContactInformation:
      type: object
      properties:
        email:
          maxLength: 255
          minLength: 0
          type: string
        carrierPhone:
          pattern: "^(\\+|\\d)[0-9\\s\\-().]{0,31}$"
          type: string
        driverPhone:
          pattern: "^(\\+|\\d)[0-9\\s\\-().]{0,31}$"
          type: string
    CarrierCountryCode:
      type: object
      properties:
        region:
          maxLength: 60
          minLength: 2
          type: string
        value:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z]{2}$"
          type: string
    CarrierInformation:
      type: object
      properties:
        carrierCompanyName:
          type: string
        carrierDriverName:
          maxLength: 60
          minLength: 2
          type: string
        carrierStreet:
          maxLength: 255
          minLength: 2
          type: string
        carrierPostcode:
          maxLength: 17
          minLength: 2
          type: string
        carrierCity:
          maxLength: 60
          minLength: 2
          type: string
        carrierCountryCode:
          $ref: "#/components/schemas/CarrierCountryCode"
        carrierLicensePlate:
          maxLength: 30
          minLength: 2
          type: string
        carrierContactInformation:
          $ref: "#/components/schemas/CarrierContactInformation"
    CarriersReservationsAndObservationsOnTakingOverTheGoods:
      type: object
      properties:
        carrierReservationsObservations:
          maxLength: 512
          minLength: 2
          type: string
        senderReservationsObservationsSignature:
          $ref: "#/components/schemas/Signature"
    CashOnDelivery:
      type: object
      properties:
        customCashOnDelivery:
          maximum: 999999
          minimum: 0
          type: number
          format: float
    ConsigneeContactInformation:
      type: object
      properties:
        email:
          maxLength: 255
          minLength: 0
          type: string
        phone:
          pattern: "^(\\+|\\d)[0-9\\s\\-().]{0,31}$"
          type: string
    ConsigneeCountryCode:
      type: object
      properties:
        region:
          maxLength: 60
          minLength: 2
          type: string
        value:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z]{2}$"
          type: string
    ConsigneeInformation:
      type: object
      properties:
        consigneeCompanyName:
          type: string
        consigneePersonName:
          maxLength: 60
          minLength: 2
          type: string
        consigneePostcode:
          maxLength: 17
          minLength: 2
          type: string
        consigneeCity:
          maxLength: 60
          minLength: 2
          type: string
        consigneeCountryCode:
          $ref: "#/components/schemas/ConsigneeCountryCode"
        consigneeStreet:
          maxLength: 255
          minLength: 2
          type: string
        consigneeContactInformation:
          $ref: "#/components/schemas/ConsigneeContactInformation"
    CustomCharge:
      type: object
      properties:
        value:
          maximum: 99999
          minimum: 0
          type: number
          format: float
        currency:
          maxLength: 512
          minLength: 2
          type: string
        payer:
          type: string
          enum:
          - SENDER
          - CONSIGNEE
    DeliveryOfTheGoods:
      type: object
      properties:
        logisticsLocationCity:
          maxLength: 60
          minLength: 2
          type: string
        logisticsLocationOpeningHours:
          maxLength: 255
          minLength: 2
          type: string
    DocumentsHandedToCarrier:
      type: object
      properties:
        documentsRemarks:
          maxLength: 512
          minLength: 2
          type: string
    EcmrConsignment:
      type: object
      properties:
        senderInformation:
          $ref: "#/components/schemas/SenderInformation"
        multiConsigneeShipment:
          $ref: "#/components/schemas/MultiConsigneeShipment"
        consigneeInformation:
          $ref: "#/components/schemas/ConsigneeInformation"
        takingOverTheGoods:
          $ref: "#/components/schemas/TakingOverTheGoods"
        deliveryOfTheGoods:
          $ref: "#/components/schemas/DeliveryOfTheGoods"
        sendersInstructions:
          $ref: "#/components/schemas/SendersInstructions"
        carrierInformation:
          $ref: "#/components/schemas/CarrierInformation"
        successiveCarrierInformation:
          $ref: "#/components/schemas/SuccessiveCarrierInformation"
        carriersReservationsAndObservationsOnTakingOverTheGoods:
          $ref: "#/components/schemas/CarriersReservationsAndObservationsOnTakingOverTheGoods"
        documentsHandedToCarrier:
          $ref: "#/components/schemas/DocumentsHandedToCarrier"
        itemList:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        specialAgreementsSenderCarrier:
          $ref: "#/components/schemas/SpecialAgreementsSenderCarrier"
        toBePaidBy:
          $ref: "#/components/schemas/ToBePaidBy"
        otherUsefulParticulars:
          $ref: "#/components/schemas/OtherUsefulParticulars"
        cashOnDelivery:
          $ref: "#/components/schemas/CashOnDelivery"
        established:
          $ref: "#/components/schemas/Established"
        goodsReceived:
          $ref: "#/components/schemas/GoodsReceived"
        nonContractualPartReservedForTheCarrier:
          $ref: "#/components/schemas/NonContractualPartReservedForTheCarrier"
        referenceIdentificationNumber:
          $ref: "#/components/schemas/ReferenceIdentificationNumber"
    EcmrModel:
      required:
      - ecmrConsignment
      type: object
      properties:
        ecmrId:
          type: string
        ecmrConsignment:
          $ref: "#/components/schemas/EcmrConsignment"
        ecmrStatus:
          type: string
          enum:
          - NEW
          - LOADING
          - IN_TRANSPORT
          - DELIVERED
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        editedAt:
          type: string
          format: date-time
        editedBy:
          type: string
    Established:
      type: object
      properties:
        customEstablishedDate:
          type: string
          format: date-time
        customEstablishedIn:
          maxLength: 30
          minLength: 2
          type: string
    GoodsReceived:
      type: object
      properties:
        confirmedLogisticsLocationName:
          maxLength: 60
          minLength: 2
          type: string
        consigneeReservationsObservations:
          maxLength: 512
          minLength: 2
          type: string
        consigneeSignature:
          $ref: "#/components/schemas/Signature"
        consigneeSignatureDate:
          type: string
          format: date-time
        consigneeTimeOfArrival:
          type: string
          format: date-time
        consigneeTimeOfDeparture:
          type: string
          format: date-time
    GrossWeightInKg:
      type: object
      properties:
        supplyChainConsignmentItemGrossWeight:
          maximum: 99999
          minimum: 0
          type: number
          format: float
    Item:
      type: object
      properties:
        marksAndNos:
          $ref: "#/components/schemas/MarksAndNos"
        numberOfPackages:
          $ref: "#/components/schemas/NumberOfPackages"
        methodOfPacking:
          $ref: "#/components/schemas/MethodOfPacking"
        natureOfTheGoods:
          $ref: "#/components/schemas/NatureOfTheGoods"
        grossWeightInKg:
          $ref: "#/components/schemas/GrossWeightInKg"
        volumeInM3:
          $ref: "#/components/schemas/VolumeInM3"
    LogisticsShippingMarksCustomBarcode:
      type: object
      properties:
        barcode:
          maxLength: 35
          minLength: 2
          type: string
    MarksAndNos:
      type: object
      properties:
        logisticsShippingMarksMarking:
          maxLength: 512
          minLength: 2
          type: string
        logisticsShippingMarksCustomBarcodeList:
          maxItems: 32
          minItems: 0
          type: array
          items:
            $ref: "#/components/schemas/LogisticsShippingMarksCustomBarcode"
    MethodOfPacking:
      type: object
      properties:
        logisticsPackageType:
          maxLength: 35
          minLength: 2
          type: string
    MultiConsigneeShipment:
      required:
      - isMultiConsigneeShipment
      type: object
      properties:
        isMultiConsigneeShipment:
          type: boolean
    NatureOfTheGoods:
      type: object
      properties:
        transportCargoIdentification:
          maxLength: 512
          minLength: 2
          type: string
    NonContractualPartReservedForTheCarrier:
      type: object
      properties:
        nonContractualCarrierRemarks:
          maxLength: 512
          minLength: 2
          type: string
    NumberOfPackages:
      type: object
      properties:
        logisticsPackageItemQuantity:
          maximum: 9999
          minimum: 0
          type: integer
          format: int32
    OtherUsefulParticulars:
      type: object
      properties:
        customParticulars:
          maxLength: 512
          minLength: 2
          type: string
    ReferenceIdentificationNumber:
      type: object
      properties:
        value:
          maxLength: 35
          minLength: 1
          type: string
    SenderContactInformation:
      type: object
      properties:
        email:
          maxLength: 255
          minLength: 0
          type: string
        phone:
          pattern: "^(\\+|\\d)[0-9\\s\\-().]{0,31}$"
          type: string
    SenderCountryCode:
      type: object
      properties:
        region:
          maxLength: 60
          minLength: 2
          type: string
        value:
          maxLength: 2
          minLength: 2
          pattern: "^[A-Z]{2}$"
          type: string
    SenderInformation:
      type: object
      properties:
        senderCompanyName:
          type: string
        senderPersonName:
          maxLength: 60
          minLength: 2
          type: string
        senderStreet:
          maxLength: 255
          minLength: 2
          type: string
        senderPostcode:
          maxLength: 17
          minLength: 2
          type: string
        senderCity:
          maxLength: 60
          minLength: 2
          type: string
        senderCountryCode:
          $ref: "#/components/schemas/SenderCountryCode"
        senderContactInformation:
          $ref: "#/components/schemas/SenderContactInformation"
    SendersInstructions:
      type: object
      properties:
        transportInstructionsDescription:
          maxLength: 512
          minLength: 2
          type: string
    Signature:
      type: object
      properties:
        type:
          type: string
        userName:
          type: string
        userCompany:
          type: string
        userStreet:
          type: string
        userPostCode:
          type: string
        userCity:
          type: string
        userCountry:
          type: string
        timestamp:
          type: string
          format: date-time
