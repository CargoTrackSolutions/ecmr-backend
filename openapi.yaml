openapi: 3.0.1
info:
  title: eCMR - API
  description: eCMR - API
  contact: {
    "name": "Open Logistics Foundation\n",
    "url": "https://openlogisticsfoundation.org/",
    "email": "ecmr-feedback@lists.openlogisticsfoundation.org"
  }
  version: v0.2.0
servers:
- url: http://localhost:8081/api
  description: Generated server url
security:
- OAUth2: []
tags:
  - name: eCMR
    description: Core eCMR operations including creation, retrieval, updates, sealing and lifecycle management.
  - name: Anonymous
    description: Endpoints accessible without authentication.
  - name: Approved URLs
    description: Management of approved URLs used to seal an eCMR.
  - name: Document
    description: Manage documents attached to an eCMR.
  - name: eCMR External
    description: External endpoint for importing an eCMR via seal ID and share token.
  - name: eCMR Imports
    description: Import workflow endpoints for eCMR entities, providing access to pending imports and approval operations.
  - name: eCMR Sync
    description: Data synchronization endpoint for aligning other eCMR instances.
  - name: Group
    description: Management of user groups including creation, retrieval, updates, deletion, hierarchy management and group membership access.
  - name: History
    description: Retrieval of the log history from an eCMR.
  - name: Mail Suffix
    description: Management of allowed mail suffixes including creation, update, deletion and import based on approved URLs.
  - name: Pending Instance
    description: Retrieval of pending eCMR import instances.
  - name: Seal Metadata
    description: Retrieval of seal-related metadata for sealed eCMRs.
  - name: Template
    description: Endpoints for managing reusable eCMR templates, including creation, update, deletion, retrieval and sharing.
  - name: User
    description: Endpoints for managing users, including creation, updates, activation/deactivation, retrieval of user data and group memberships.
paths:
  /anonymous/ecmr:
    put:
      tags:
        - Anonymous
      summary: Update eCMR
      operationId: updateEcmr_1
      parameters:
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrModel"
        required: true
      responses:
        default:
          description: Updated eCMR model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "403":
          description: No permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "401":
          description: External user not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
  /anonymous/ecmr-role:
    get:
      tags:
        - Anonymous
      summary: Get External User eCMR Roles
      operationId: getExternalUserEcmrRoles
      parameters:
        - name: ecmrId
          in: query
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      responses:
        default:
          description: List of eCMR roles
          content:
            application/json:
              schema:
                type: string
                enum:
                  - Reader
                  - Sender
                  - Carrier
                  - Consignee
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - Reader
                    - Sender
                    - Carrier
                    - Consignee
        "401":
          description: External user not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  enum:
                    - Reader
                    - Sender
                    - Carrier
                    - Consigne
  /anonymous/is-tan-valid:
    get:
      tags:
        - Anonymous
      summary: Check TAN Validity
      operationId: isTanValid
      parameters:
        - name: ecmrId
          in: query
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: tan
          in: query
          description: TAN to validate
          required: true
          schema:
            type: string
        - name: userToken
          in: query
          required: true
          schema:
            type: string
      responses:
        default:
          description: Validity of the TAN
          content:
            application/json:
              schema:
                type: boolean
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                type: boolean
  /anonymous/registration:
    post:
      tags:
        - Anonymous
      summary: Register External User
      operationId: registerExternalUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalUserRegistrationModel"
        required: true
      responses:
        "200":
          description: User registered successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserRegistrationResponseModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserRegistrationResponseModel"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserRegistrationResponseModel"
        "500":
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserRegistrationResponseModel"
  /anonymous/registration-info/{ecmrId}:
    get:
      tags:
        - Anonymous
      summary: Get eCMR carrier information
      operationId: getExternalUserRegistrationInfo
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: token
          in: query
          description: shareToken of the eCMR
          required: true
          schema:
            type: string
      responses:
        default:
          description: eCMR carrier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalUserInformationModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserInformationModel"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExternalUserInformationModel"
  /anonymous/ecmr/{ecmrId}:
    get:
      tags:
        - Anonymous
      summary: Get eCMR Details
      operationId: getEcmrWith
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
        - name: userToken
          in: query
          required: true
          schema:
            type: string
      responses:
        default:
          description: eCMR details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "403":
          description: No permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "401":
          description: External user not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
  /anonymous/ecmr/{ecmrId}/pdf:
    get:
      tags:
        - Anonymous
      summary: Download eCMR PDF
      operationId: downloadEcmrPdfFile_1
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      responses:
        default:
          description: eCMR PDF file
          content:
            application/pdf: { }
        "403":
          description: No permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
        "500":
          description: PDF creation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
        "401":
          description: External user not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StreamingResponseBody"
  /anonymous/ecmr/{ecmrId}/seal:
    post:
      tags:
        - Anonymous
      summary: Seal eCMR
      operationId: seal_1
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMRto seal
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      responses:
        "404":
          description: eCMR not found
        "403":
          description: Forbidden access
        "401":
          description: External user not found
        "400":
          description: Validation error or seal already present
  /anonymous/ecmr/{ecmrId}/seal-metadata:
    get:
      tags:
        - Anonymous
      summary: Retrieve seal metadata by eCMR ID
      operationId: getSealMetadata
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      responses:
        default:
          description: The requested seal metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealMetadata"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SealMetadata"
        "403":
          description: Forbidden access
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SealMetadata"
  /anonymous/ecmr/{ecmrId}/share:
    patch:
      tags:
        - Anonymous
      summary: Share eCMR
      operationId: shareEcmr_1
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrShareModel"
        required: true
      responses:
        default:
          description: Share response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "501":
          description: Not implemented
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "400":
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "403":
          description: No permission
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "401":
          description: External user not found
          content:
            '*/*':
