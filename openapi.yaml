  /anonymous/ecmr/{ecmrId}/share-token:
    get:
      tags:
        - Anonymous
      summary: Get Share Token for eCMR
      operationId: getShareToken_1
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
        - name: userToken
          in: query
          description: Unique token of the external user
          required: true
          schema:
            type: string
        - name: tan
          in: query
          description: TAN for validation
          required: true
          schema:
            type: string
        - name: ecmrRole
          in: query
          description: Role for the eCMR
          required: true
          schema:
            type: string
            enum:
              - Reader
              - Sender
              - Carrier
              - Consignee
      responses:
        default:
          description: Share token
          content:
            application/json:
              schema:
                type: string
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                type: string
        "403":
          description: No permission
          content:
            '*/*':
              schema:
                type: string
        "401":
          description: External user not found
          content:
            '*/*':
              schema:
                type: string
  /approved-url:
    get:
      tags:
        - Approved URLs
      summary: Get Approved URLs
      operationId: getApprovedUrls
      responses:
        default:
          description: List of all URLs and their approval state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedUrl"
    post:
      tags:
        - Approved URLs
      summary: Create a new approved url
      operationId: createApprovedUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedUrlCreationModel"
        required: true
      responses:
        default:
          description: The created approvedUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
  /approved-url/multiple:
    post:
      tags:
        - Approved URLs
      summary: Create multiple ApprovedUrls
      operationId: createMultipleApprovedUrls
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ApprovedUrlCreationModel"
        required: true
      responses:
        default:
          description: List of created ApprovedUrls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovedUrl"
  /approved-url/{id}:
    put:
      tags:
        - Approved URLs
      summary: Update an approved url
      operationId: updateApprovedUrl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovedUrlUpdateModel"
        required: true
      responses:
        default:
          description: The updated approvedUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApprovedUrl"
  /approved-url/{approvedUrlId}:
    delete:
      tags:
        - Approved URLs
      summary: Delete specific approvedUrl
      operationId: deleteUrlApproval
      parameters:
        - name: approvedUrlId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        default:
          description: Boolean indicating whether the deletion was successful
          content:
            application/json:
              schema:
                type: boolean
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                type: boolean
        "404":
          description: Approved URL not found
          content:
            '*/*':
              schema:
                type: boolean
  /document:
    get:
      tags:
        - Document
      operationId: getEcmrDocuments
      parameters:
        - name: ecmrId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentModel"
    post:
      tags:
        - Document
      operationId: uploadDocumentToEcmr
      parameters:
        - name: ecmrId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
        required: true
      responses:
        "200":
          description: OK
  /document/{id}/download:
    get:
      tags:
        - Document
      operationId: downloadDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /document/{id}:
    delete:
      tags:
        - Document
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
  /ecmr:
    post:
      tags:
        - eCMR
      summary: Create a new eCMR
      operationId: createEcmr
      parameters:
        - name: groupId
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
              format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrModel"
        required: true
      responses:
        default:
          description: The created eCMR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "403":
          description: Forbidden access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "400":
          description: Bad request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
    put:
      tags:
        - eCMR
      summary: Update an existing eCMR
      operationId: updateEcmr
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrModel"
        required: true
      responses:
        default:
          description: The updated eCMR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "403":
          description: Forbidden access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
  /ecmr/{ecmrId}:
    get:
      tags:
        - eCMR
      summary: Retrieve eCMR by ID
      operationId: getEcmr
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The requested eCMR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
        "403":
          description: Forbidden access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrModel"
    delete:
      tags:
        - eCMR
      summary: Delete an eCMR
      operationId: deleteEcmr
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR to delete
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: eCMR deleted successfully
        "404":
          description: eCMR not found
        "401":
          description: Unauthorized access
        "403":
          description: Forbidden access
  /ecmr/{ecmrId}/share:
    patch:
      tags:
        - eCMR
      summary: Share an eCMR
      operationId: shareEcmr
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR to share
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrShareModel"
        required: true
      responses:
        default:
          description: Successfully shared eCMR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "404":
          description: eCMR not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "401":
          description: Unauthorized access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "403":
          description: Forbidden access
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "400":
          description: Bad request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
  /ecmr/{ecmrId}/shareWithGroup:
    patch:
      tags:
        - eCMR
      summary: Share an eCMR
      operationId: shareEcmrWithGroup
      parameters:
        - name: ecmrId
          in: path
          description: UUID of the eCMR to share
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcmrShareWithGroupModel"
        required: true
      responses:
        default:
          description: Successfully shared eCMR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EcmrShareResponse"
        "404":
          description: eCMR or group not found
          content:
