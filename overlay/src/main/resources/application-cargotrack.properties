# CargoTrack profile - activate with SPRING_PROFILES_ACTIVE=cargotrack (plus "jobs" on the job-runner instance).
# Environment-specific values (DB, issuer, SMTP, URLs, keystore, secrets) come from environment variables,
# see config/backend.env.example.

spring.liquibase.change-log=classpath:db/cargotrack/changelog-master.xml

cargotrack.sms.enabled=false
cargotrack.sms.url=
cargotrack.sms.token=

# Attachments: mount a persistent volume here (or switch to ecmr.storage.provider=azureblob).
ecmr.storage.filesystem.directory=/data/attachments

# Upstream defaults point at the bundled development keystore and expose the full Swagger UI;
# production values are set via environment variables (see config/backend.env.example).
