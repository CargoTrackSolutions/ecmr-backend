# eCMR staging on internal-software-staging (192.168.140.4), public as https://ecmr-staging.cargotrack.ro
# (DevOps reverse proxy terminates TLS and forwards to :8190, the "router" below).
#   /       frontend      /api    backend      /auth   Keycloak (admin console via SSH tunnel only)
# Local-only ports (ssh -L): Keycloak admin 127.0.0.1:8180 (http://localhost:8180/auth/admin), Mailpit 127.0.0.1:8125.
# Secrets in .env (chmod 600). Images: ecmr-backend:staging / ecmr-frontend:staging (docker load).
#   cd /opt/ecmr && docker compose up -d        logs: docker compose logs -f ecmr-backend
#
# The backend fetches the OIDC configuration from the public issuer URL at startup, so this server must be able
# to reach https://ecmr-staging.cargotrack.ro itself.

name: ecmr

x-public-url: &public https://ecmr-staging.cargotrack.ro

services:
  router:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8190:80"
    volumes:
      - ./router.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keycloak
      - ecmr-frontend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecmr
      POSTGRES_USER: ecmr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecmr -d ecmr"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    # dev mode = embedded H2 on the kcdata volume; acceptable for staging only
    command: start-dev --import-realm
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://ecmr-staging.cargotrack.ro/auth
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - kcdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 10s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8125:8025"

  ecmr-backend:
    image: ecmr-backend:staging
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: cargotrack,jobs
      APP_ORIGIN_URL: *public
      APP_FRONTEND_URL: *public
      WEB_CORS_ORIGINS: *public
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecmr
      SPRING_DATASOURCE_USERNAME: ecmr
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_LIQUIBASE_PARAMETERS_BOOTSTRAPADMINEMAIL: admin@cargotrack.local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: https://ecmr-staging.cargotrack.ro/auth/realms/cargotrack
      SPRINGDOC_SWAGGER_UI_OAUTH_CLIENTID: ecmr-frontend
      SWAGGER_AUTH_URL: https://ecmr-staging.cargotrack.ro/auth/realms/cargotrack/protocol/openid-connect/auth
      SWAGGER_TOKEN_URL: https://ecmr-staging.cargotrack.ro/auth/realms/cargotrack/protocol/openid-connect/token
      # SMTP from .env; without SMTP_HOST all mails go to Mailpit (ssh -L 8125:localhost:8125)
      SPRING_MAIL_HOST: ${SMTP_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-ecmr-staging@cargotrack.ro}
      ECMR_SEAL_SIGN_KEYSTORETYPE: PKCS12
      ECMR_SEAL_SIGN_KEYSTOREPATH: /secrets/eseal.p12
      ECMR_SEAL_SIGN_KEYSTOREPASSWORD: ${ESEAL_PASSWORD}
      ECMR_SEAL_SIGN_KEYALIAS: cargotrack-ecmr
      ECMR_SEAL_SIGN_KEYPASSWORD: ${ESEAL_PASSWORD}
      CARGOTRACK_SMS_ENABLED: ${CARGOTRACK_SMS_ENABLED:-false}
      CARGOTRACK_SMS_TOKEN: ${CARGOTRACK_SMS_TOKEN:-}
      CARGOTRACK_SMS_SENDER: ${CARGOTRACK_SMS_SENDER:-}
      CARGOTRACK_SMS_TEMPLATE: ${CARGOTRACK_SMS_TEMPLATE:-}
    volumes:
      - ./secrets/eseal.p12:/secrets/eseal.p12:ro
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started

  ecmr-frontend:
    image: ecmr-frontend:staging
    restart: unless-stopped
    environment:
      BACKEND_API_URL: https://ecmr-staging.cargotrack.ro/api
      OAUTH_ISSUER: https://ecmr-staging.cargotrack.ro/auth/realms/cargotrack
      OAUTH_CLIENT_ID: ecmr-frontend

volumes:
  pgdata:
  kcdata:
  attachments:
