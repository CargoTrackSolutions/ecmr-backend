# Single entry point on :8190 (plain HTTP); TLS terminates at the DevOps reverse proxy for
# https://ecmr-staging.cargotrack.ro. Routes by path to frontend, backend (/api) and Keycloak (/auth).
server {
  listen 80;
  server_tokens off;
  client_max_body_size 200m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  # Keycloak admin console only through an SSH tunnel (KC_HOSTNAME_ADMIN=http://localhost:8180/auth)
  location /auth/admin/ {
    return 404;
  }

  location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Actuator: health only (metrics/prometheus stay internal)
  location = /api/actuator/health {
    proxy_pass http://ecmr-backend:8080;
  }

  location /api/actuator/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://ecmr-backend:8080;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://ecmr-frontend:8080;
  }
}
