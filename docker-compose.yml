version: "3.8"
services:
  # Frontend
  ecmr-frontend:
    build: ../ecmr-frontend/
    env_file:
      - config/frontend-params.env
    ports:
      - "8092:8080"
    depends_on:
      keycloak:
        condition: service_healthy

  # Backend
  ecmr-backend:
    build:
      context: .
      dockerfile: Dockerfile-for-compose
    env_file:
      - config/backend-params.env
    volumes:
      - ./src/main/resources/eseal/test-keystore.jks:/data/test-keystore.jks
    network_mode: "service:localhost"
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_healthy

  # Postgres-Database
  postgres:
    image: postgres:16
    env_file:
      - config/postgres-params.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  keycloak:
    image: keycloak/keycloak
    volumes:
      - ./config/keycloak/:/opt/keycloak/data/import/
      - ./config/keycloak/theme/cargotrack:/opt/keycloak/themes/cargotrack
    command: start-dev --import-realm
    env_file:
      - config/keycloak/keycloak-params.env
    network_mode: "service:localhost"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r

            Host: localhost:9000\r

            Connection: close\r

            \r

            ' >&3;cat <&3 | grep -q '\"status\": \"UP\"' && exit 0 || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      - postgres
      - localhost

  localhost:
    image: alpine:latest
    command: sleep infinity
    ports:
      - "8090:8080" # Keycloak port
      - "8091:8081" # Backend port
